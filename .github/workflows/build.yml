name: build

on:
  workflow_dispatch:
  push:
    tags: ['20*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential libusb-1.0-0
      - name: Build self-contained liquidctl bundle
        env:
          PYTHON: python3
          VERSION: 2026.06.27.2
          PIP_ROOT_USER_ACTION: ignore
          PIP_DISABLE_PIP_VERSION_CHECK: 1
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: liquidctl-unraid
          path: |
            dist/liquidctl-*.tgz
            liquidctl.plg
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/liquidctl-*.tgz
            liquidctl.plg
          generate_release_notes: true
